<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe0e9, #fdf6f0, #e0f7fa);
    color: #444;
    transition: 0.5s;
}

.dark {
    background: #0f172a;
    color: #eee;
}

/* PASSWORD */
#lockScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

/* TYPEWRITER */
#typewriter {
    font-family: 'Patrick Hand';
    font-size: 2rem;
    text-align: center;
    margin-top: 20px;
}

/* SECTIONS */
section {
    padding: 60px 20px;
    max-width: 1000px;
    margin: auto;
}

/* TIMELINE */
.timeline {
    border-left: 3px solid #ff6b81;
    padding-left: 20px;
}

.timeline div {
    margin-bottom: 20px;
}

/* LETTERS */
.letter {
    background: white;
    padding: 15px;
    margin: 10px 0;
    cursor: pointer;
}

.hidden { display: none; }

/* VINYL */
.vinyl {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #111 40%, #333 60%, #000);
    border-radius: 50%;
    cursor: pointer;
}

.spin { animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* HEART */
.heart {
    position: fixed;
    animation: float 1s forwards;
}
@keyframes float {
    to { transform: translateY(-100px); opacity: 0; }
}

/* BUTTONS */
button {
    padding: 10px 20px;
    margin-top: 10px;
    background: #ff6b81;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 40px;
}
</style>
</head>

<body>

<!-- LOCK -->
<div id="lockScreen">
    <h2>Enter Password 💌</h2>
    <input type="password" id="pass">
    <button onclick="unlock()">Enter</button>
</div>

<div id="main" style="display:none;">

<h1 id="typewriter"></h1>

<section>
<h2>⏳ Our Timeline</h2>
<div class="timeline">
    <div>First time we talked ❤️</div>
    <div>Our funniest moment 😂</div>
    <div>When I realized you're special 💖</div>
</div>
</section>

<section>
<h2>💌 Open When...</h2>
<div class="letter" onclick="toggle(1)">
    When you're sad
    <p id="l1" class="hidden">I'm always here for you ❤️</p>
</div>

<div class="letter" onclick="toggle(2)">
    When you miss me
    <p id="l2" class="hidden">I miss you more 💌</p>
</div>
</section>

<section>
<h2>🎁 Surprise</h2>
<button onclick="surprise()">Don't click 😏</button>
</section>

<footer>I love you ❤️</footer>

</div>

<!-- MUSIC -->
<audio id="music" loop>
<source src="song.mp3">
</audio>

<div class="vinyl" id="vinyl" onclick="toggleMusic()"></div>

<script>

/* PASSWORD */
function unlock(){
    if(document.getElementById("pass").value === "2204"){
        document.getElementById("lockScreen").style.display="none";
        document.getElementById("main").style.display="block";
        typeWriter();
    }
}

/* TYPEWRITER */
let text="Hey... this is our little world ❤️";
let i=0;
function typeWriter(){
    if(i<text.length){
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter,50);
    }
}

/* LETTER */
function toggle(n){
    document.getElementById("l"+n).classList.toggle("hidden");
}

/* MUSIC */
let music=document.getElementById("music");
let vinyl=document.getElementById("vinyl");
let playing=false;

function toggleMusic(){
    if(!playing){
        music.play();
        vinyl.classList.add("spin");
        playing=true;
    } else {
        music.pause();
        vinyl.classList.remove("spin");
        playing=false;
    }
}

/* HEART */
document.addEventListener("click", e=>{
    let h=document.createElement("div");
    h.innerHTML="💖";
    h.className="heart";
    h.style.left=e.clientX+"px";
    h.style.top=e.clientY+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
});

/* SURPRISE */
function surprise(){
    alert("You’re my favorite person ❤️");
}

/* DARK MODE TOGGLE */
document.addEventListener("dblclick", ()=>{
    document.body.classList.toggle("dark");
});

</script>

</body>
</html>
