<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe0e9, #fdf6f0, #e0f7fa);
    color: #444;
    overflow-x: hidden;
}

/* PASSWORD SCREEN */
#lockScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

input {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    background: #ff6b81;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

/* Fade animation */
.fade-in {
    opacity: 0;
    transform: translateY(30px);
    transition: 1s;
}

.fade-in.show {
    opacity: 1;
    transform: translateY(0);
}

/* Header */
header {
    text-align: center;
    padding: 60px 20px;
    backdrop-filter: blur(10px);
}

/* Sections */
section {
    padding: 50px 20px;
    max-width: 1000px;
    margin: auto;
}

/* Gallery */
.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.polaroid {
    background: white;
    padding: 10px;
    width: 200px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    transform: rotate(-3deg);
    transition: 0.4s;
}

.polaroid:hover {
    transform: scale(1.08) rotate(0deg);
}

/* Quotes */
.quote-box {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 20px;
}

.quote {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

/* Letters */
.letter {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-left: 5px solid #ff9aa2;
    cursor: pointer;
}

.hidden { display: none; }

/* VINYL (BIGGER) */
.vinyl {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 110px;
    height: 110px;
    background: radial-gradient(circle, #111 40%, #333 60%, #000 100%);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    cursor: pointer;
    z-index: 100;
}

.vinyl::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 25px;
    background: #ff4d6d;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.spin {
    animation: spin 2s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* HEART PARTICLES */
.heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp 1s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}

footer {
    text-align: center;
    padding: 40px;
    font-family: 'Patrick Hand', cursive;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="lockScreen">
    <h2>Enter Password 💌</h2>
    <input type="password" id="password" placeholder="Hint: something special 😉">
    <button onclick="checkPassword()">Enter</button>
</div>

<!-- MAIN CONTENT -->
<div id="content" style="display:none;">

<header class="fade-in">
    <h1>Hey Beautiful ❤️</h1>
</header>

<section class="fade-in">
    <h2>📸 Our Memories</h2>
    <div class="gallery">
        <div class="polaroid"><img src="first memory.jpg"></div>
        <div class="polaroid"><img src="photo2.jpg"></div>
    </div>
</section>

<section class="fade-in">
    <h2>💖 Little Things I Love About You</h2>
    <div class="quote-box">
        <div class="quote">Your smile makes everything better.</div>
        <div class="quote">You make life feel lighter.</div>
    </div>
</section>

<section class="fade-in">
    <h2>📝 Letters</h2>
    <div class="letter" onclick="toggleLetter(1)">
        Open 💌
        <p id="letter1" class="hidden">You’re my favorite person.</p>
    </div>
</section>

<footer>I love you. Always ❤️</footer>

</div>

<!-- MUSIC -->
<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- VINYL -->
<div class="vinyl" onclick="toggleMusic()" id="vinyl"></div>

<script>

/* PASSWORD */
function checkPassword(){
    let pass = document.getElementById("password").value;
    if(pass === "1234"){  // CHANGE THIS
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        alert("Wrong password 😅");
    }
}

/* LETTER */
function toggleLetter(id){
    document.getElementById("letter"+id).classList.toggle("hidden");
}

/* FADE */
const elements = document.querySelectorAll('.fade-in');
window.addEventListener('scroll', () => {
    elements.forEach(el => {
        if(el.getBoundingClientRect().top < window.innerHeight - 100){
            el.classList.add('show');
        }
    });
});

/* MUSIC */
let music = document.getElementById("bg-music");
let vinyl = document.getElementById("vinyl");
let playing = false;

function toggleMusic(){
    if(!playing){
        music.play();
        vinyl.classList.add("spin");
        playing = true;
    } else {
        music.pause();
        vinyl.classList.remove("spin");
        playing = false;
    }
}

/* HEART PARTICLES */
document.addEventListener("click", function(e){
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.classList.add("heart");
    heart.style.left = e.clientX + "px";
    heart.style.top = e.clientY + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 1000);
});

</script>

</body>
</html>
